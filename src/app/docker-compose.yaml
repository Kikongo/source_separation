version: '3.8'

services:
  fastapi-backend:
    build: ./fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./shared:/app/shared
      - ./fastapi/models:/app/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  streamlit-frontend:
    build: ./streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./shared:/app/shared
    depends_on:
      - fastapi-backend
    environment:
      - API_URL=http://fastapi-backend:8000