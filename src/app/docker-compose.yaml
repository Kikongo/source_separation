version: '3.8'

services:

  # ── Redis: job broker + result backend ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"          # expose only if you need external access; remove for prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI web process (lightweight — just accepts requests & returns status) ─
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - shared_data:/app/shared
      - ./backend/models:/app/models:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Celery worker: runs the actual ML inference ──────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A tasks worker
        --loglevel=info
        --concurrency=1
        --queues=celery
        --max-tasks-per-child=10
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - shared_data:/app/shared
      - ./backend/models:/app/models:ro
    environment:
      - REDIS_URL=redis://redis:6379/0


  # ── Celery Flower: task monitoring dashboard ─────────────────────────────────
  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    depends_on:
      - redis
    ports:
      - "5555:5555"         # access at http://localhost:5555

  # ── Streamlit frontend ────────────────────────────────────────────────────────
  streamlit-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - fastapi-backend
    volumes:
      - shared_data:/app/shared
    environment:
      - API_URL=http://nginx/api
    expose:
      - "8501"

  # ── Nginx: reverse proxy + rate limiting ─────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - fastapi-backend
      - streamlit-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  shared_data:    # single volume shared between backend, worker, and frontend