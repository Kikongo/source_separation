worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limit: 10 requests/second per IP, burst of 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Larger uploads (audio files can be big)
    client_max_body_size 50M;

    upstream backend {
        server fastapi-backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server streamlit-frontend:8501;
    }

    server {
        listen 80;

        # --- API ---
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Separate endpoint has long processing time on CPU
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # Long-poll status endpoint — needs longer read timeout
        location /api/status/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # File downloads can be large
        location /api/download/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
        }

        # --- Frontend (Streamlit) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Streamlit uses WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}